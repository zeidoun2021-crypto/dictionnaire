yaml
name: Tester index.html

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Vérifier que index.html existe
        run: |
          if [ -f "index.html" ]; then
            echo "✅ index.html trouvé"
          else
            echo "❌ index.html manquant"
            exit 1
          fi
      
      - name: Vérifier le contenu HTML
        run: |
          if grep -q "<html" index.html; then
            echo "✅ Tag HTML trouvé"
          else
            echo "❌ Tag HTML manquant"
            exit 1
          fi
